[package]
name = "lumen-protocol"
version.workspace = true
edition.workspace = true
# 与 lumen-server 树同步（服务端部署路径的 MSRV 上限，理由见其 Cargo.toml）；
# 本 crate 自身依赖仅需更低版本，取服务端树上限便于统一维护。
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "Lumen 远程控制协议：客户端与 lumen-server 共享的线缆类型（零平台依赖）"

[dependencies]
serde = { workspace = true }
# M5.3 数据面盲转：Relay 载荷用不透明 serde_json::Value，服务端不解析内部、
# 原样转发；客户端两端共享 RemoteFrame 强类型收发。纯跨平台，零平台依赖。
serde_json = { workspace = true }
# 文件传输块 base64 编码（避免 Vec<u8> JSON 数字数组膨胀 ~4x）。
base64 = { workspace = true }
# M7 片 6 扫码配对：二维码载荷里的账户指纹 sha256(user_id)[..16]。
# 放在协议 crate 而不是各端各算一遍——大小写、截取长度任何一处不同，都会让所有扫码
# 都判成 ForeignAccount，而那看起来像「功能没做好」而不是「两端算法不一致」。
sha2 = { workspace = true }
