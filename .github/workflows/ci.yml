# Lumen 持续集成：守住「编译过 + 测试绿 + clippy 0 warning」与跨平台
# 编译不回归。发版打包另见 release.yml。
#
# 三平台一等公民（跨平台移植后，见 feat/cross-platform-linux-macos）：
# - Windows：权威平台（历史发布目标），clippy -D warnings + 全量测试。
# - Linux / macOS：正式 build + test（阻塞）。Windows 专属能力在非 Windows
#   走跨平台实现或优雅降级（见各模块 cfg(not(windows)) 分支）。
#   Linux runner 需装 wgpu/winit/arboard/rfd 依赖的 X11/Wayland/GTK 运行库。
#
# Rust 工具链 pin 到固定版本（dtolnay/rust-toolchain@1.97.0），不追滚动
# stable：滚动 stable 会因新版编译器/clippy 引入的 lint 让 main 无端变红
# （2026-07 实测 1.96→1.97 触发 f32:From<f64> fallback 47 处 + 格式化宏多余
# 引用），与代码改动无关。要升级 Rust：改这里的版本号 + 本地同版验证后再提。
# release.yml / package-linux.yml / package-macos.yml 同步 pin 同一版本。

name: ci

# paths-ignore：纯 mobile/ 或纯 docs/ 的改动不触发 Rust 全量编译（M7 片 0b）。
# lumen-app 是超大 crate，三平台各编一遍的代价与「改了一个 Dart 文件」完全不成比例；
# 移动端有自己的 workflow（mobile.yml）。
#
# ⚠ 加这个过滤的已知翻车点（设计蓝图 R15，**改分支保护前先读**）：
# workflow 级 paths-ignore 命中时，**整个 workflow 不会运行**，三个 Rust job 在 PR 上
# 既不是成功也不是失败，而是「压根没有这个 check」。若它们被设成 required checks，
# 只改 mobile/ 的 PR 将**永远无法合并**（GitHub 会一直等一个不会到来的 check）。
#   现状（2026-08-09 实测）：`gh api repos/:owner/:repo/branches/main/protection` 返回
#   404 Branch not protected ⇒ 本仓库当前**没有**分支保护，这条不咬人。
#   将来若要开分支保护，二选一：
#     (a) 不把 test-windows/linux/macos 设成 required；
#     (b) 去掉这里的 paths-ignore，改成「dorny/paths-filter 条件 job + 一个恒绿的 gate job」，
#         把 gate job 设成 required。
# 不要在没读这段的情况下顺手打开分支保护。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'

# 同一分支新推送取消尚在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 权威：Windows 上 clippy 0 warning + 测试。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy（0 warning）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --workspace

  # Linux：正式 build + test。
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # wgpu（Vulkan/GL loader）、winit（X11/Wayland/xkb）、arboard（X11 剪贴板）、
      # rfd（GTK3 同步文件对话框）在 Linux 上链接这些系统库；缺任一则 lumen
      # 二进制链接失败。
      - name: 安装系统依赖（X11 / Wayland / GTK / xkb / 等宽字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            pkg-config \
            fonts-dejavu-core
          # 渲染器需一个真实等宽字体（pick_mono_family 命中 DejaVu Sans Mono）；
          # headless runner 默认可能无等宽字体，否则字体测量测试会挂。
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: 测试（含全 crate 构建）
        run: cargo test --workspace

  # macOS：正式 build + test（AppKit/Metal 随 Xcode SDK 内置，无需额外系统包）。
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: 测试（含全 crate 构建）
        run: cargo test --workspace
